# lorad region select for the LoRaWAN + Meshtastic apps (deployed to /rfnm/apps/lora/).
# Valid values: us915 (US 902-928 MHz) | eu868 (EU 863-870 MHz).
#   LoRaWAN  us915 -> sub-band 1, 902.3-903.7 MHz, SF7-10   | eu868 -> 867.1-868.5 MHz, SF7-12
#   Meshtastic us915 -> 906.875 MHz LongFast               | eu868 -> 869.525 MHz LongFast
# Change the line below and restart the app from the APPS tab to switch regions.
LORAD_REGION=us915
