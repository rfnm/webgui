CELL_GAIN=30
ISM_ANT=embed
ISM_GAIN=30
ISM_AGC=0
CELL_AGC=0
LORA_AGC=0
AIS_AGC=0
ADSB_ANT=sma_a
ADSB_GAIN=30
ADSB_AGC=0
