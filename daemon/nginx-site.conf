# RFNM on-board web GUI + machine API (webgui/API.md). Static WebGL2 page from
# /rfnm/spectrum/www; /ws is the spectrum daemon's binary WebSocket (also reachable direct
# on :7681 - a declared data port). /api/ is the one control door: /api/v1/* = appd, and
# appd generates the per-app /api/app/<id>/ routes into /rfnm/apps/nginx-apps.conf from the
# manifests (/rfnm/apps/*/app.json) - adding an app never edits this file.
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /rfnm/spectrum/www;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript;

	location / {
		try_files $uri $uri/ =404;
	}

	# the board API (appd on 7683). /api/v1/* is appd core; the generated /api/app/<id>/
	# locations below win by longest prefix. No URI on proxy_pass: appd sees /api/v1/...
	location /api/ {
		proxy_pass http://127.0.0.1:7683;
		proxy_read_timeout 60s;
	}

	# readsb JSON output (aircraft.json, stats.json) - static files, not an HTTP API
	location /adsb/ {
		alias /run/rfnm-adsb/;
		add_header Cache-Control no-store;
	}

	# per-app API routes, generated by appd from the manifests
	include /rfnm/apps/nginx-apps.conf;

	location /captures/ {
		alias /mnt/usb/;
		default_type application/octet-stream;
	}

	location /ws {
		proxy_pass http://127.0.0.1:7681;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		proxy_buffering off;
	}
}
